name: Build SMTH OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "auto/**"
      - "config/**"
      - "assets/boot/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

concurrency:
  group: smth-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build in Debian Bookworm
        run: |
          docker run --rm --privileged \
            -v "$PWD:/work" -w /work debian:bookworm \
            bash -lc '
              set -e
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                live-build debootstrap squashfs-tools xorriso \
                grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
                librsvg2-bin
              chmod +x auto/config scripts/*.sh
              chmod +x config/hooks/normal/*.hook.chroot
              chmod +x config/includes.chroot/usr/local/bin/*
              ./auto/config
              ./scripts/prepare-bootloaders.sh
              lb build
            '

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: smth-os-amd64-live-iso
          path: "*.iso"
          if-no-files-found: error
          retention-days: 14
