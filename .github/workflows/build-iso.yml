name: Build SMTH OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "auto/**"
      - "config/**"
      - "apps/launcher/**"
      - "assets/boot/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

concurrency:
  group: smth-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build the shared Flutter launcher for Linux
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Compile launcher for the ISO
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
          flutter create --platforms=linux --project-name smth_launcher --org dev.smth --empty /tmp/smth_linux
          cp -R /tmp/smth_linux/linux apps/launcher/
          cp /tmp/smth_linux/.metadata apps/launcher/.metadata
          cd apps/launcher
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build linux --release
          cd ../..
          mkdir -p config/includes.chroot/opt/smth/launcher
          cp -R apps/launcher/build/linux/x64/release/bundle/. config/includes.chroot/opt/smth/launcher/

      - name: Build in Debian Bookworm
        run: |
          docker run --rm --privileged \
            -v "$PWD:/work" -w /work debian:bookworm \
            bash -lc '
              set -e
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                live-build debootstrap squashfs-tools xorriso \
                grub-pc-bin grub-efi-amd64-bin mtools dosfstools \
                librsvg2-bin
              chmod +x auto/config scripts/*.sh
              chmod +x config/hooks/normal/*.hook.chroot
              chmod +x config/includes.chroot/usr/local/bin/*
              chmod +x config/includes.chroot/opt/smth/launcher/smth_launcher
              ./auto/config
              ./scripts/prepare-bootloaders.sh
              lb build
            '

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: smth-os-amd64-live-iso
          path: "*.iso"
          if-no-files-found: error
          retention-days: 14
