name: Build SMTH OS ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Debian Live-Build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin mtools dosfstools librsvg2-bin

      - name: Prepare SMTH configuration
        run: |
          chmod +x auto/config
          chmod +x scripts/*.sh
          chmod +x config/hooks/normal/*.hook.chroot
          chmod +x config/includes.chroot/usr/local/bin/*
          sudo ./auto/config
          sudo ./scripts/prepare-bootloaders.sh

      - name: Build bootable live ISO
        run: sudo lb build

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: smth-os-amd64-live-iso
          path: "*.iso"
          if-no-files-found: error
          retention-days: 14
