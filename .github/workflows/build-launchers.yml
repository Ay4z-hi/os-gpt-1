name: Build SMTH launchers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/launcher/**"
      - ".github/workflows/build-launchers.yml"
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform and build
        shell: bash
        run: |
          set -euxo pipefail
          flutter create --platforms=android --project-name smth_launcher --org dev.smth --empty /tmp/smth_platform
          cp -R /tmp/smth_platform/android apps/launcher/
          cp /tmp/smth_platform/.metadata apps/launcher/.metadata
          # Flutter's newest Android template can select AGP 9; retain the compatible legacy DSL for now.
          if grep -q '^android.newDsl=' apps/launcher/android/gradle.properties; then
            sed -i 's/^android.newDsl=.*/android.newDsl=false/' apps/launcher/android/gradle.properties
          else
            echo 'android.newDsl=false' >> apps/launcher/android/gradle.properties
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" --sdk_root="$ANDROID_HOME" || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' apps/launcher/android/app/build.gradle.kts
          cd apps/launcher
          flutter pub get
          FILE_PICKER_GRADLE="$(find "$PUB_CACHE/hosted/pub.dev" -path '*/file_picker-*/android/build.gradle' -print -quit)"
          if [ -z "$FILE_PICKER_GRADLE" ]; then
            echo "Could not locate file_picker Android Gradle file"
            exit 1
          fi
          echo "Raising file_picker compile SDK in $FILE_PICKER_GRADLE"
                    python3 - "$FILE_PICKER_GRADLE" <<'PY'
          import re
          import sys

          path = sys.argv[1]
          with open(path, encoding="utf-8") as source:
              content = source.read()

          pattern = r"(?m)^(\s*compileSdk(?:Version)?\s+)34(\s*(?://.*)?$)"
          updated, count = re.subn(pattern, r"\g<1>36\g<2>", content)
          if count < 1:
              print("Could not find a literal compileSdk 34 declaration:")
              print("\n".join(line for line in content.splitlines() if "compileSdk" in line))
              raise SystemExit(1)

          with open(path, "w", encoding="utf-8") as target:
              target.write(updated)

          print("Patched declarations:", count)
          for line in updated.splitlines():
              if "compileSdk" in line:
                  print(line)
          if re.search(r"(?m)^\s*compileSdk(?:Version)?\s+34\b", updated):
              raise SystemExit("file_picker compile SDK is still 34")
          PY
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: SMTH-Android-APK
          path: apps/launcher/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Windows platform and build
        shell: bash
        run: |
          set -euxo pipefail
          flutter create --platforms=windows --project-name smth_launcher --org dev.smth --empty /tmp/smth_platform
          cp -R /tmp/smth_platform/windows apps/launcher/
          cp /tmp/smth_platform/.metadata apps/launcher/.metadata
          cd apps/launcher
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build windows --release
          mv build/windows/x64/runner/Release/smth_launcher.exe build/windows/x64/runner/Release/SMTH-Launcher.exe
      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path apps/launcher/build/windows/x64/runner/Release/* -DestinationPath SMTH-Windows-Launcher.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SMTH-Windows-Launcher
          path: SMTH-Windows-Launcher.zip
          if-no-files-found: error
