name: Build SMTH Windows launcher

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/windows/**"
      - ".github/workflows/build-windows-launcher.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Build launcher
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SMTH-Launcher apps/windows/smth_launcher.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SMTH-Windows-Launcher
          path: dist/SMTH-Launcher.exe
          if-no-files-found: error
